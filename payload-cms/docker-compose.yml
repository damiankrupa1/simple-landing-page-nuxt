# Local-only stack. Nothing here reads payload-cms/.env (it may hold the production database URL and secrets);
# every value is set in this file. Compose itself still reads .env in this folder for ${...} substitution, but
# only for the LOCAL_* port variables below, which the real .env does not define.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload
    ports:
      # Loopback only: the credentials are the well-known postgres/postgres
      - '127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
